name: Allen build

# Builds the Linux musl nicegui binary (x86_64) from allen-build and publishes
# it as the "allen-build" release of this fork. The Docker image repo
# (Terwilligrrr/docker-twitch-drops-miner) watches that release and builds
# ghcr.io/terwilligrrr/twitch-drops-miner from it.

on:
  push:
    branches:
      - "allen-build"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"
  RELEASE_TAG: allen-build

permissions:
  contents: read

concurrency:
  group: allen-build-${{github.ref}}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{env.PYTHON_VERSION}}

      - name: Validate language files
        run: |
          failed=()
          for file in "lang/"*.json "webui/lang/"*.json; do
            if err="$(python -m json.tool "${file}" 2>&1 >/dev/null)"; then
              echo "[OK] ${file}"
            else
              echo "[ERROR] ${file} ${err}"
              failed+=("${file}")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo -e "\nFailed to validate the following language file(s): ${failed[@]}"
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@v10.3.1
        with:
          python-version: ${{env.PYTHON_VERSION}}
          enable-cache: true

      - name: Run tests
        run: uv run --group nicegui --group test pytest tests/ -x

  build:
    name: Build nicegui (x86_64)
    runs-on: ubuntu-24.04
    needs:
      - validate
      - test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Append git revision to project version
        run: |
          sed -ri "s/^__version__\s*=\s*\"[^\"]+/\0.$(git rev-parse --short HEAD)/" version.py
          grep '^__version__' version.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build nicegui binary
        run: |
          docker build -f Dockerfile.alpine --build-arg ARCH=x86_64 --build-arg UI_BACKEND=nicegui -t twitch-drops-miner-nicegui:x86_64 .

      - name: Extract build artifact
        run: |
          docker create --name extract-nicegui twitch-drops-miner-nicegui:x86_64
          docker cp extract-nicegui:/app/Twitch.Drops.Miner.Linux.musl.PyInstaller-nicegui-x86_64.zip .
          docker rm extract-nicegui

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: Twitch.Drops.Miner.Linux.musl.PyInstaller-nicegui-x86_64
          path: Twitch.Drops.Miner.Linux.musl.PyInstaller-nicegui-x86_64.zip

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: write
    # Only one release rewrite at a time; a newer push waits instead of racing.
    concurrency:
      group: allen-build-release
      cancel-in-progress: false
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Replace the allen-build release
        env:
          GH_TOKEN: ${{github.token}}
          SHA: ${{github.sha}}
        run: |
          find artifacts -type f
          mapfile -t files < <(find artifacts -type f -name '*.zip')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No zip found in the downloaded artifacts"
            exit 1
          fi
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete "${RELEASE_TAG}" --cleanup-tag --yes --repo "${GITHUB_REPOSITORY}"
          fi
          cat > notes.md <<NOTES
          Automatic build of the \`allen-build\` branch (fireph's webui + Allen's changes).
          Used by the Docker image \`ghcr.io/terwilligrrr/twitch-drops-miner\`.

          - Last build date: \`$(date --rfc-3339=seconds)\`
          - Reference commit: ${SHA}
          NOTES
          gh release create "${RELEASE_TAG}" "${files[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${SHA}" \
            --title "allen-build" \
            --notes-file notes.md \
            --prerelease
